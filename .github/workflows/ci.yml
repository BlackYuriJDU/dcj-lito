name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consistencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências leves
        run: pip install matplotlib openpyxl pytest
      - name: Testes estatísticos + consistência relatório↔script↔figuras
        run: python -m pytest tests/ -q
